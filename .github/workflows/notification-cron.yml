name: Transactional notification cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transactional-notification-cron
  cancel-in-progress: false

jobs:
  process-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process notification outbox
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::notice::GitHub Actions secret CRON_SECRET is not configured; skipping scheduled notification processing."
            exit 0
          fi

          curl             --fail-with-body             --silent             --show-error             --max-time 30             --retry 2             --retry-delay 2             --header "Authorization: Bearer ${CRON_SECRET}"             "https://www.proxybembem.com.br/api/internal/notifications/process"
