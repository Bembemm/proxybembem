name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up exact KingHost runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.1.0
          cache: pnpm
      - name: Verify exact KingHost Node version
        run: |
          node - <<'NODE'
          if (process.version !== "v22.1.0") {
            throw new Error(`Expected v22.1.0, got ${process.version}`)
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - name: Apply scoped lint fixes
        if: github.ref == 'refs/heads/hardening/site-security-nonce'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "app/admin/pedidos/[id]/page.tsx",
              "function actionUrl(orderId: string, action: string) {\n  return `/api/internal/admin/orders/${orderId}/${action}`\n}\n\n",
              "",
          )
          replace_once(
              "app/admin/pedidos/page.tsx",
              "    pageSize: 25,\n",
              "    pageSize: PAGE_SIZE,\n",
          )
          replace_once(
              "app/admin/produtos/page.tsx",
              "    pageSize: 25,\n",
              "    pageSize: PAGE_SIZE,\n",
          )
          replace_once(
              "components/cart-items.tsx",
              'import { Minus, Plus, Trash2 } from "lucide-react"\n',
              'import { Minus, Plus } from "lucide-react"\n',
          )
          replace_once(
              "components/navbar.tsx",
              '    setAccountState("loading")\n',
              "",
          )
          replace_once(
              "components/navbar.tsx",
              '  useEffect(() => {\n    setIsCategoriesOpen(false)\n    setIsMobileMenuOpen(false)\n  }, [pathname])\n\n',
              "",
          )
          replace_once(
              "components/navbar.tsx",
              '    <Link\n      href={accountItem.href}\n',
              '    <Link\n      href={accountItem.href}\n      onClick={() => {\n        setIsCategoriesOpen(false)\n        setIsMobileMenuOpen(false)\n      }}\n',
          )
          replace_once(
              "components/pages/products-page.tsx",
              'import { useEffect, useState } from "react"\n',
              'import { useState } from "react"\n',
          )
          replace_once(
              "components/pages/products-page.tsx",
              '  useEffect(() => {\n    setSelectedCategories(initialCategory ? [initialCategory] : [])\n  }, [initialCategory])\n\n',
              "",
          )
          replace_once(
              "app/produtos/page.tsx",
              '    <ProductsPage\n      products={products}\n',
              '    <ProductsPage\n      key={initialCategory ?? "all-products"}\n      products={products}\n',
          )
          replace_once(
              "lib/server/shipment-generation.ts",
              "interface PrintShipmentLike extends GenerationShipmentLike {}\n",
              "type PrintShipmentLike = GenerationShipmentLike\n",
          )
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/pedidos/'[id]'/page.tsx app/admin/pedidos/page.tsx app/admin/produtos/page.tsx app/produtos/page.tsx components/cart-items.tsx components/navbar.tsx components/pages/products-page.tsx lib/server/shipment-generation.ts
          git commit -m "fix: resolve lint violations [skip ci]"
          git push origin HEAD:hardening/site-security-nonce
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build:kinghost
      - name: Verify private order route contract
        run: |
          node - <<'NODE'
          const manifest = require("./.next/server/app-paths-manifest.json")
          if (Object.keys(manifest).some((route) => route.startsWith("/pedido/"))) {
            throw new Error("Public /pedido route is still present in the production build")
          }
          if (!manifest["/minha-conta/pedidos/[id]/page"]) {
            throw new Error("Private customer order detail route is missing from the production build")
          }
          console.log("private-order-route-contract-ok")
          NODE
      - name: Smoke KingHost startup adapter
        run: |
          node - <<'NODE'
          const { resolveKingHostPort } = require("./app.js")
          if (resolveKingHostPort({ PORT_APP: "21169", PORT: "3000" }) !== "21169") {
            process.exit(1)
          }
          NODE

      # Node 22.1.0 predates Node's built-in TypeScript type stripping.
      # Production code is typechecked/built/smoked above on the exact KingHost runtime;
      # Node 24 is used only to execute the raw .ts test files without another test loader.
      - name: Set up TypeScript test runner
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm test
