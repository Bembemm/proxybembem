name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: Verify private order route contract
        run: |
          node - <<'NODE'
          const manifest = require("./.next/server/app-paths-manifest.json")
          if (Object.keys(manifest).some((route) => route.startsWith("/pedido/"))) {
            throw new Error("Public /pedido route is still present in the production build")
          }
          if (!manifest["/minha-conta/pedidos/[id]/page"]) {
            throw new Error("Private customer order detail route is missing from the production build")
          }
          console.log("private-order-route-contract-ok")
          NODE

      - name: Critical commerce and security subset
        run: |
          node --experimental-strip-types --test \
            tests/checkout-flow.test.ts \
            tests/checkout-route.test.ts \
            tests/checkout-origin.test.ts \
            tests/shipping-quote.test.ts \
            tests/shipping-quote-token.test.ts \
            tests/mercadopago-checkout-url.test.ts \
            tests/mercadopago-preference.test.ts \
            tests/webhook-route.test.ts \
            tests/webhook-signature.test.ts \
            tests/melhor-envio-oauth-routes.test.ts \
            tests/private-order-only.test.ts \
            tests/phase9-route-security.test.ts \
            tests/phase9-supabase-hardening.test.ts

      - run: pnpm test
