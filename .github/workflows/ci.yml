name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stale lint-contract test updates
        if: github.ref == 'refs/heads/hardening/site-security-nonce'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/admin-orders-ui.test.ts",
              '  assert.match(page, /pageSize:\\s*25/)\n',
              '  assert.match(page, /const\\s+PAGE_SIZE\\s*=\\s*25/)\n  assert.match(page, /pageSize:\\s*PAGE_SIZE/)\n',
          )
          replace_once(
              "tests/admin-products-ui.test.ts",
              '  assert.match(page, /pageSize:\\s*25/)\n',
              '  assert.match(page, /const\\s+PAGE_SIZE\\s*=\\s*25/)\n  assert.match(page, /pageSize:\\s*PAGE_SIZE/)\n',
          )
          replace_once(
              "tests/storefront-product-catalog.test.ts",
              '  assert.match(productsRoute, /<ProductsPage\\s+products=/)\n',
              '  assert.match(productsRoute, /<ProductsPage/)\n  assert.match(productsRoute, /products=\\{products\\}/)\n',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/admin-orders-ui.test.ts tests/admin-products-ui.test.ts tests/storefront-product-catalog.test.ts
          git commit -m "test: align lint-refactor contracts [skip ci]"
          git push origin HEAD:hardening/site-security-nonce
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up exact KingHost runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.1.0
          cache: pnpm
      - name: Verify exact KingHost Node version
        run: |
          node - <<'NODE'
          if (process.version !== "v22.1.0") {
            throw new Error(`Expected v22.1.0, got ${process.version}`)
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build:kinghost
      - name: Verify private order route contract
        run: |
          node - <<'NODE'
          const manifest = require("./.next/server/app-paths-manifest.json")
          if (Object.keys(manifest).some((route) => route.startsWith("/pedido/"))) {
            throw new Error("Public /pedido route is still present in the production build")
          }
          if (!manifest["/minha-conta/pedidos/[id]/page"]) {
            throw new Error("Private customer order detail route is missing from the production build")
          }
          console.log("private-order-route-contract-ok")
          NODE
      - name: Smoke KingHost startup adapter
        run: |
          node - <<'NODE'
          const { resolveKingHostPort } = require("./app.js")
          if (resolveKingHostPort({ PORT_APP: "21169", PORT: "3000" }) !== "21169") {
            process.exit(1)
          }
          NODE

      # Node 22.1.0 predates Node's built-in TypeScript type stripping.
      # Production code is typechecked/built/smoked above on the exact KingHost runtime;
      # Node 24 is used only to execute the raw .ts test files without another test loader.
      - name: Set up TypeScript test runner
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm test
